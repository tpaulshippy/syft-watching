<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Syft Watching</title>
<meta name="description" content="One safe search box for YouTube and Disney+. Pick something to watch — a parent gets emailed automatically.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1226;
    --bg-soft:#111a36;
    --card:#182244;
    --card-2:#1f2c55;
    --ink:#f4f6ff;
    --ink-dim:#aeb8d8;
    --line:rgba(255,255,255,.1);
    --accent:#ffb020;
    --accent-ink:#231600;
    --teal:#3ddad7;
    --yt:#ff5a5a;
    --dz:#5aa8ff;
    --radius:22px;
    --shadow:0 12px 32px rgba(0,0,0,.45);
  }
  [data-theme="light"]{
    --bg:#eef2ff;
    --bg-soft:#ffffff;
    --card:#ffffff;
    --card-2:#f3f5ff;
    --ink:#16204a;
    --ink-dim:#5a6694;
    --line:rgba(22,32,74,.12);
    --accent:#ff9d0a;
    --accent-ink:#231600;
    --shadow:0 10px 28px rgba(35,50,140,.16);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(700px 320px at 15% -40px, rgba(255,176,32,.22), transparent 60%),
      radial-gradient(800px 380px at 90% -60px, rgba(61,218,215,.18), transparent 60%),
      radial-gradient(600px 500px at 50% 120%, rgba(90,168,255,.12), transparent 60%),
      var(--bg);
    transition:background .3s ease,color .3s ease;
  }
  [data-theme="light"] body{background:
      radial-gradient(700px 320px at 15% -40px, rgba(255,176,32,.28), transparent 60%),
      radial-gradient(800px 380px at 90% -60px, rgba(61,218,215,.22), transparent 60%),
      var(--bg)}
  [hidden]{display:none!important}
  .wrap{max-width:960px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) calc(90px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-right))}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 6px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
  .logo{
    width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:1.7rem;flex:none;
    background:linear-gradient(135deg,#ffb020,#ff6b6b 60%,#7c5cff);
    box-shadow:0 8px 22px rgba(255,107,107,.4);
  }
  .brand h1{font-family:"Baloo 2",cursive;font-size:1.55rem;margin:0;line-height:1.05;letter-spacing:.2px;overflow-wrap:anywhere}
  .brand p{margin:2px 0 0;color:var(--ink-dim);font-size:.95rem;font-weight:600}
  .top-right{display:flex;align-items:center;gap:10px;flex:none;min-width:0;max-width:100%}
  #userArea{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;flex-wrap:wrap}
  #userChip{
    display:inline-flex;align-items:center;gap:8px;max-width:200px;
    background:rgba(61,218,215,.12);border:2px solid rgba(61,218,215,.5);
    color:var(--ink);font-weight:800;font-size:.95rem;
    padding:8px 14px 8px 8px;border-radius:999px;white-space:nowrap;overflow:hidden;
  }
  #userChip img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
  #userChip span{overflow:hidden;text-overflow:ellipsis;min-width:0}
  #signOutBtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    font-family:"Nunito",sans-serif;font-weight:800;font-size:.92rem;cursor:pointer;
    border-radius:14px;padding:10px 14px;min-height:48px;
  }
  #signOutBtn:active{transform:scale(.96)}
  .wall{
    margin:14px 0 16px;background:linear-gradient(180deg,var(--card),var(--bg-soft));
    border:2px solid var(--line);border-radius:28px;padding:38px 24px 30px;
    box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;
  }
  .wall::after{
    content:"";position:absolute;inset:auto -60px -90px -60px;height:150px;
    background:radial-gradient(closest-side,rgba(255,176,32,.25),transparent);
    pointer-events:none;
  }
  .rocket{
    width:96px;height:96px;margin:0 auto 8px;border-radius:32px;display:grid;place-items:center;font-size:3.4rem;
    background:linear-gradient(135deg,#ffb020,#ff6b6b 60%,#7c5cff);
    box-shadow:0 12px 30px rgba(255,107,107,.45);
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  .wall h2{font-family:"Baloo 2",cursive;margin:10px 0 0;font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.1}
  .wall h2 .hl{color:var(--accent)}
  .wall .why{margin:8px auto 0;max-width:26rem;color:var(--ink-dim);font-weight:700;font-size:1.02rem}
  #gisWallBtn{display:flex;justify-content:center;margin:20px 0 6px;min-height:48px;position:relative;z-index:1}
  #gisWallBtn iframe{border-radius:12px;max-width:100%}
  .auth-msg{
    display:none;margin:12px auto 0;max-width:30rem;padding:10px 16px;border-radius:14px;
    background:rgba(255,90,90,.12);border:1.5px solid rgba(255,90,90,.55);
    font-weight:700;font-size:.98rem;
  }
  .config-note{
    display:none;margin:14px auto 0;max-width:30rem;padding:14px 18px;border-radius:16px;
    background:rgba(255,176,32,.12);border:2px dashed rgba(255,176,32,.65);
    font-weight:700;font-size:1rem;text-align:left;
  }
  .gis-error{
    display:none;margin:14px auto 0;max-width:30rem;padding:14px 18px;border-radius:16px;
    background:rgba(255,90,90,.1);border:2px solid rgba(255,90,90,.5);
    font-weight:700;font-size:1rem;
  }
  .gis-error button{
    margin-top:10px;font-family:"Baloo 2",cursive;font-size:1.05rem;font-weight:800;cursor:pointer;
    background:linear-gradient(180deg,#ffc44d,var(--accent));color:var(--accent-ink);
    border:none;border-radius:12px;padding:10px 22px;min-height:48px;
  }
  .wall .tiny{margin:14px auto 0;max-width:28rem;color:var(--ink-dim);font-size:.9rem;font-weight:600}
  .hero{
    margin:14px 0 16px;background:linear-gradient(180deg,var(--card),var(--bg-soft));
    border:2px solid var(--line);border-radius:28px;padding:24px 20px;
    box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;inset:auto -60px -90px -60px;height:150px;
    background:radial-gradient(closest-side,rgba(255,176,32,.25),transparent);
    pointer-events:none;
  }
  .hero h2{font-family:"Baloo 2",cursive;margin:0;font-size:clamp(1.5rem,4.5vw,2.2rem);line-height:1.1}
  .hero h2 .hl{color:var(--accent)}
  .hero p{margin:8px auto 0;max-width:34rem;color:var(--ink-dim);font-weight:600;font-size:1.02rem}
  .searchbar{
    display:flex;gap:10px;margin-top:16px;position:relative;z-index:1;
    flex-direction:row;
  }
  .searchbar input{
    flex:1;min-width:0;font-size:max(1.2rem,16px);font-weight:700;color:var(--ink);
    background:var(--bg);border:3px solid var(--line);border-radius:18px;
    padding:16px 18px;outline:none;
  }
  .searchbar input:focus{border-color:var(--accent)}
  .searchbar input::placeholder{color:var(--ink-dim);font-weight:600;font-size:inherit}
  .searchbar button{
    font-family:"Baloo 2",cursive;font-size:1.2rem;font-weight:800;cursor:pointer;
    background:linear-gradient(180deg,#ffc44d,var(--accent));color:var(--accent-ink);
    border:none;border-radius:18px;padding:16px 26px;min-height:60px;min-width:132px;
    box-shadow:0 8px 20px rgba(255,176,32,.35);transition:transform .15s ease;
  }
  .searchbar button:active{transform:scale(.96)}
  .how{
    margin:14px 0 6px;border-radius:18px;padding:14px 16px;font-size:1rem;font-weight:600;
    background:rgba(255,176,32,.12);border:2px dashed rgba(255,176,32,.65);
  }
  .how b{font-weight:800}
  .how ol{margin:8px 0 0;padding-left:1.3rem;display:grid;gap:4px}
  #rankNote{
    display:none;margin:18px 2px 10px;padding:10px 14px;border-radius:14px;
    background:rgba(61,218,215,.1);border:1.5px solid rgba(61,218,215,.4);
    font-weight:700;font-size:.98rem;
  }
  #status{text-align:center;color:var(--ink-dim);font-weight:700;font-size:1.12rem;margin:26px 8px;line-height:1.5}
  #status.big{font-size:1.25rem}
  .spinner{
    width:46px;height:46px;margin:0 auto 10px;border-radius:50%;
    border:5px solid var(--line);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #results{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .card{
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;
    animation:rise .35s ease backwards;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .art{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0e1630;max-width:100%}
  .art img{width:100%;height:100%;object-fit:cover;display:block;max-width:100%}
  .art.fallback{display:grid;place-items:center;text-align:center;padding:10px;
    background:linear-gradient(135deg,#2b3a7d,#6d3fd4 45%,#ff6b6b 100%)}
  [data-theme="light"] .art.fallback{background:linear-gradient(135deg,#7c9bff,#b07cff 45%,#ff8a5c 100%)}
  .art.fallback .letter{
    font-family:"Baloo 2",cursive;font-size:3rem;font-weight:800;color:#fff;
    width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);
  }
  .art.fallback small{display:block;color:rgba(255,255,255,.92);font-weight:700;font-size:.8rem;margin-top:6px}
  .badge{
    position:absolute;top:10px;left:10px;font-size:.82rem;font-weight:800;
    padding:6px 12px;border-radius:999px;backdrop-filter:blur(4px);
  }
  .badge.yt{background:rgba(20,0,0,.72);color:#ffb3b3;border:1.5px solid rgba(255,90,90,.8)}
  .badge.dz{background:rgba(0,12,40,.72);color:#c4dcff;border:1.5px solid rgba(90,168,255,.8)}
  .card .body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
  .card h3{margin:0;font-size:1.08rem;line-height:1.3;font-weight:800;overflow-wrap:anywhere}
  .meta{color:var(--ink-dim);font-size:.92rem;font-weight:700;overflow-wrap:anywhere}
  .watch{
    display:block;text-align:center;margin-top:10px;text-decoration:none;
    font-family:"Baloo 2",cursive;font-size:1.25rem;font-weight:800;
    background:linear-gradient(180deg,#3ddad7,#23b3b0);color:#062b2a;
    border-radius:15px;padding:14px;min-height:56px;
    box-shadow:0 6px 16px rgba(61,218,215,.3);transition:transform .15s ease;
  }
  .watch:active{transform:scale(.97)}
  #toast{
    position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);
    background:#101c3f;color:#fff;border:2px solid rgba(61,218,215,.6);
    padding:14px 20px;border-radius:16px;font-weight:800;font-size:1.02rem;
    box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:all .3s ease;
    max-width:min(92vw,480px);width:max-content;text-align:center;overflow-wrap:anywhere;z-index:50;
  }
  [data-theme="light"] #toast{background:#16204a}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  footer{margin-top:30px;text-align:center;color:var(--ink-dim);font-weight:600;font-size:.92rem}
  .skeleton{border-radius:var(--radius);background:linear-gradient(180deg,var(--card),var(--card-2));border:2px solid var(--line);overflow:hidden}
  .skeleton .art{background:linear-gradient(100deg,var(--card-2) 30%,rgba(255,255,255,.12) 50%,var(--card-2) 70%);background-size:200% 100%;animation:shimmer 1.1s linear infinite;aspect-ratio:16/9}
  @keyframes shimmer{to{background-position:-200% 0}}
  .skeleton .pad{padding:14px}
  .skeleton .bar{height:14px;border-radius:8px;background:rgba(255,255,255,.14);margin:8px 0}
  @media (max-width:560px){
    .brand h1{font-size:1.25rem}
    .wall{padding:24px 16px;overflow-wrap:anywhere}
    .hero{padding:20px 16px;overflow-wrap:anywhere}
    .searchbar{flex-direction:column}
    .searchbar button{width:100%;min-width:0}
    #results{grid-template-columns:1fr;gap:12px}
    .card h3{font-size:.98rem}
    .watch{font-size:1.1rem;min-height:52px;padding:12px}
    #userChip{max-width:112px;font-size:.85rem;padding:8px 10px 8px 8px}
    #signOutBtn{padding:10px 12px;min-height:44px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">🚀</div>
      <div>
        <h1>Syft Watching</h1>
      </div>
    </div>
    <div class="top-right">
      <div id="userArea" hidden>
        <span id="userChip" title="Signed in"></span>
        <button id="signOutBtn" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <section id="wall" class="wall" aria-label="Sign in">
    <div class="rocket" aria-hidden="true">🚀</div>
    <h2>Sign in</h2>
    <div id="gisWallBtn" aria-label="Sign in with Google"></div>
    <div id="authMsg" class="auth-msg" role="status"></div>
    <div id="configNote" class="config-note" role="note"></div>
    <div id="gisError" class="gis-error" role="alert"></div>
  </section>

  <div id="app" hidden>
    <section class="hero">
      <h2 id="hello" hidden></h2>
      <div class="searchbar">
        <input id="q" type="search" placeholder="Search…" aria-label="Search" autocomplete="off" enterkeyhint="search">
        <button id="searchBtn" type="button" aria-label="Search">🔍 Search</button>
      </div>
    </section>

    <div id="rankNote" role="note" hidden></div>
    <div id="status" class="big"></div>
    <div id="results" aria-live="polite"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
var root = document.documentElement;
var input = document.getElementById("q");
var searchBtn = document.getElementById("searchBtn");
var statusEl = document.getElementById("status");
var resultsEl = document.getElementById("results");
var rankNote = document.getElementById("rankNote");
var toastEl = document.getElementById("toast");
var wallEl = document.getElementById("wall");
var appEl = document.getElementById("app");
var userArea = document.getElementById("userArea");
var userChip = document.getElementById("userChip");
var signOutBtn = document.getElementById("signOutBtn");
var gisWallBtn = document.getElementById("gisWallBtn");
var authMsg = document.getElementById("authMsg");
var configNote = document.getElementById("configNote");
var gisError = document.getElementById("gisError");
var helloEl = document.getElementById("hello");
var debounce = null;
var lastQuery = "";
var toastTimer = null;
var lastItems = [];

var CRED_KEY = "syft-credential";
var credential = null; // Google ID token, memory + localStorage (persists across sessions)
var googleClientId = "";
var gisReady = false;
var gisLoading = false;

function applySystemTheme() {
  var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  root.setAttribute("data-theme", prefersLight ? "light" : "dark");
}
applySystemTheme();
(function watchSystemTheme() {
  try {
    var mq = window.matchMedia("(prefers-color-scheme: light)");
    var onChange = function () {
      applySystemTheme();
      if (!wallEl.hidden && googleClientId) renderGisButton();
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  } catch (e) {}
})();

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 3600);
}

// Display name only — decoded client-side for a friendly hello, never trusted for auth.
function displayNameFromCredential(cred) {
  try {
    var parts = String(cred).split(".");
    if (parts.length < 2) return null;
    var b64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var payload = JSON.parse(atob(b64));
    var first = payload.given_name || String(payload.name || "").split(" ")[0] || "";
    return { first: first, picture: payload.picture || "" };
  } catch (e) { return null; }
}

function isCredentialExpired(cred) {
  try {
    var parts = String(cred).split(".");
    if (parts.length < 2) return true;
    var b64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var payload = JSON.parse(atob(b64));
    var exp = payload.exp;
    if (!exp || isNaN(Number(exp))) return true;
    return Number(exp) * 1000 <= Date.now() + 60000; // ~60s clock skew margin
  } catch (e) { return true; }
}

function setSession(cred) {
  credential = cred;
  try { localStorage.setItem(CRED_KEY, cred); } catch (e) {}
}

function clearSession() {
  credential = null; // clear memory
  try { localStorage.removeItem(CRED_KEY); } catch (e) {} // clear persisted copy
}

function showWall(msg) {
  appEl.hidden = true;
  wallEl.hidden = false;
  userArea.hidden = true;
  if (msg) {
    authMsg.textContent = msg;
    authMsg.style.display = "block";
  } else {
    authMsg.textContent = "";
    authMsg.style.display = "none";
  }
}

function showApp(first, picture) {
  wallEl.hidden = true;
  appEl.hidden = false;
  userArea.hidden = false;
  authMsg.textContent = "";
  authMsg.style.display = "none";
  var hello = "";
  if (first) {
    var chip = first;
    userChip.textContent = chip;
    if (picture) {
      userChip.textContent = "";
      var img = document.createElement("img");
      img.src = picture;
      img.alt = "";
      img.referrerPolicy = "no-referrer";
      var span = document.createElement("span");
      span.textContent = first;
      userChip.appendChild(img);
      userChip.appendChild(span);
    }
  } else {
    userChip.textContent = "Hi";
  }
  helloEl.textContent = hello;
}

function handleSessionExpired() {
  clearSession();
  try { if (window.google && window.google.accounts && window.google.accounts.id) window.google.accounts.id.disableAutoSelect(); } catch (e) {}
  resultsEl.innerHTML = "";
  if (rankNote) rankNote.style.display = "none";
  showWall("Signed out — sign in");
  renderGisButton();
  showToast("Signed out");
}

function onCredential(response) {
  var cred = response && response.credential;
  if (!cred) {
    showWall("Sign-in failed — retry");
    return;
  }
  setSession(cred);
  var who = displayNameFromCredential(cred);
  showApp(who && who.first, who && who.picture);
  showToast("Signed in");
  if (input) input.focus();
}

signOutBtn.addEventListener("click", function () {
  clearSession(); // memory + localStorage both cleared
  try { if (window.google && window.google.accounts && window.google.accounts.id) window.google.accounts.id.disableAutoSelect(); } catch (e) {}
  lastQuery = "";
  lastItems = [];
  resultsEl.innerHTML = "";
  if (rankNote) rankNote.style.display = "none";
  if (statusEl) { statusEl.textContent = ""; statusEl.classList.add("big"); }
  if (input) input.value = "";
  showWall("Signed out");
  renderGisButton();
});

function renderGisButton() {
  gisWallBtn.innerHTML = "";
  gisError.style.display = "none";
  gisError.innerHTML = "";
  if (!googleClientId) return; // setup note handles this case
  if (!gisReady || !window.google || !window.google.accounts) { showGisError(); return; }
  try {
    window.google.accounts.id.initialize({ client_id: googleClientId, callback: onCredential, auto_select: true, cancel_on_tap_outside: true });
    var dark = root.getAttribute("data-theme") !== "light";
    window.google.accounts.id.renderButton(gisWallBtn, { type: "standard", theme: dark ? "filled_black" : "outline", size: "large", text: "signin_with", shape: "pill", logo_alignment: "left" });
  } catch (e) { showGisError(); }
}

function showGisError() {
  if (googleClientId && gisReady) return;
  if (!googleClientId) return;
  gisError.style.display = "block";
  gisError.innerHTML = "";
  var msg = document.createElement("div");
  msg.textContent = "No internet — retry";
  var btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = "Retry";
  btn.addEventListener("click", function () { bootAuth(); });
  gisError.appendChild(msg);
  gisError.appendChild(btn);
}

function loadGisScript() {
  return new Promise(function (resolve, reject) {
    if (window.google && window.google.accounts && window.google.accounts.id) { resolve(); return; }
    if (gisLoading) {
      var iv = setInterval(function () {
        if (window.google && window.google.accounts && window.google.accounts.id) { clearInterval(iv); resolve(); }
      }, 200);
      setTimeout(function () { clearInterval(iv); reject(new Error("still loading")); }, 15000);
      return;
    }
    gisLoading = true;
    var s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.defer = true;
    s.onload = function () { gisLoading = false; resolve(); };
    s.onerror = function () { gisLoading = false; reject(new Error("gis blocked")); };
    document.head.appendChild(s);
    setTimeout(function () {
      if (!(window.google && window.google.accounts && window.google.accounts.id)) {
        gisLoading = false;
        reject(new Error("gis timeout"));
      }
    }, 15000);
  });
}

async function bootAuth() {
  gisError.style.display = "none";
  gisError.innerHTML = "";
  configNote.style.display = "none";
  configNote.textContent = "";
  var clientId = "";
  try {
    var r = await fetch("/api/config");
    if (r.ok) {
      var data = await r.json();
      clientId = (data && data.googleClientId) || "";
    }
  } catch (e) { clientId = ""; }
  if (!clientId) {
    googleClientId = "";
    gisWallBtn.innerHTML = "";
    configNote.style.display = "block";
    configNote.textContent = "Setup needed — retry later";
    if (credential) { clearSession(); showWall(null); configNote.style.display = "block"; configNote.textContent = "Setup needed — retry later"; }
    return;
  }
  googleClientId = clientId;
  try {
    await loadGisScript();
    gisReady = true;
    if (wallEl.hidden === false || !credential) renderGisButton();
    else renderGisButton();
    if (!credential && !wallEl.hidden) {
      try { window.google.accounts.id.prompt(); } catch (e) {}
    }
  } catch (e) {
    gisReady = false;
    showGisError();
  }
}

// Restore a signed-in session so a reload doesn't re-prompt.
(function restore() {
  try {
    var saved = localStorage.getItem(CRED_KEY);
    if (saved) {
      if (isCredentialExpired(saved)) { try { localStorage.removeItem(CRED_KEY); } catch (e2) {} }
      else {
        var who = displayNameFromCredential(saved);
        if (who && (who.first || who.picture)) {
          credential = saved;
          showApp(who.first, who.picture);
        } else if (saved.split(".").length === 3) {
          credential = saved;
          showApp("", "");
        }
      }
    }
  } catch (e) {}
})();

input.addEventListener("input", function () {
  clearTimeout(debounce);
  debounce = setTimeout(doSearch, 500);
});
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { clearTimeout(debounce); doSearch(); }
});
searchBtn.addEventListener("click", function () { clearTimeout(debounce); doSearch(); });

function setLoading(q) {
  statusEl.innerHTML = '<div class="spinner" aria-hidden="true"></div>Searching…';
  rankNote.style.display = "none";
  var s = "";
  for (var i = 0; i < 4; i++) {
    s += '<div class="skeleton" aria-hidden="true"><div class="art"></div><div class="pad"><div class="bar" style="width:80%"></div><div class="bar" style="width:45%"></div></div></div>';
  }
  resultsEl.innerHTML = s;
}

async function doSearch() {
  if (!credential) {
    showWall("Sign in first");
    showToast("Sign in first");
    return;
  }
  var q = input.value.trim();
  resultsEl.innerHTML = "";
  rankNote.style.display = "none";
  if (!q) {
    lastQuery = "";
    statusEl.textContent = "";
    statusEl.classList.add("big");
    return;
  }
  lastQuery = q;
  statusEl.classList.remove("big");
  setLoading(q);
  try {
    var r = await fetch("/api/search?q=" + encodeURIComponent(q), { headers: { "Authorization": "Bearer " + credential } });
    if (r.status === 401) { handleSessionExpired(); return; }
    if (r.status === 403) { var b = await r.json().catch(function () { return null; }); if (q !== lastQuery) return; resultsEl.innerHTML = ""; statusEl.textContent = "Blocked — try a different search"; return; }
    if (!r.ok) throw new Error("Search hiccup (code " + r.status + ")");
    var data = await r.json();
    if (q !== lastQuery) return; // a newer search started; ignore stale reply
    var items = (data && data.results) || [];
    if (!items.length) {
      resultsEl.innerHTML = "";
      statusEl.textContent = "Nothing found";
      return;
    }
    var ranked = rank(items);
    statusEl.textContent = "";
    rankNote.style.display = "none";
    lastItems = ranked;
    resultsEl.innerHTML = ranked.map(cardHTML).join("");
  } catch (err) {
    if (q !== lastQuery) return;
    resultsEl.innerHTML = "";
    statusEl.textContent = "No internet — retry";
  }
}

// Disney+ (movies & shows) first, then YouTube videos — stable within each group.
function rank(items) {
  var score = { disney: 0, youtube: 1 };
  return items.slice().sort(function (a, b) {
    var sa = score[a.source] !== undefined ? score[a.source] : 2;
    var sb = score[b.source] !== undefined ? score[b.source] : 2;
    return sa - sb;
  });
}

function cardHTML(item, i) {
  var isDisney = item.source === "disney";
  var title = item.title || "Untitled";
  var url = item.watchUrl || "";
  var metaBits = [];
  if (item.type) metaBits.push(item.type);
  if (item.year) metaBits.push(item.year);
  var meta = metaBits.join(" • ");
  var badge = isDisney
    ? '<span class="badge dz">Disney+</span>'
    : '<span class="badge yt">YouTube</span>';
  var art;
  if (item.thumbnail) {
    art = '<div class="art">' + badge +
      '<img src="' + escapeAttr(item.thumbnail) + '" alt="" loading="lazy" onerror="thumbFail(this,' + i + ')">' +
      "</div>";
  } else {
    art = fallbackArt(badge, title);
  }
  return '<article class="card" style="animation-delay:' + Math.min(i * 60, 420) + 'ms" data-thumb="' + escapeAttr(title) + '">' +
    art +
    '<div class="body"><h3>' + escapeHtml(title) + "</h3>" +
    (meta ? '<div class="meta">' + escapeHtml(meta) + "</div>" : "") +
    '<a class="watch" href="' + escapeAttr(url) + '" target="_blank" rel="noopener" ' +
      'onclick="return onWatch(event,' + i + ')">▶ Watch</a>' +
    "</div></article>";
}

function fallbackArt(badge, title) {
  var letter = (title || "?").trim().charAt(0).toUpperCase() || "?";
  return '<div class="art fallback">' + badge +
    '<div><div class="letter">' + escapeHtml(letter) + "</div>" +
    "<small>No preview</small></div></div>";
}

// Called from the inline onerror handler when a thumbnail URL breaks.
window.thumbFail = function (img, i) {
  var card = img.closest(".card");
  var title = (card && card.getAttribute("data-thumb")) || "?";
  var badge = card ? card.querySelector(".badge") : null;
  var div = document.createElement("div");
  div.className = "art fallback";
  var badgeHTML = badge ? badge.outerHTML : "";
  var letter = title.trim().charAt(0).toUpperCase() || "?";
  div.innerHTML = badgeHTML + '<div><div class="letter"></div><small>No preview</small></div>';
  div.querySelector(".letter").textContent = letter;
  img.replaceWith(div);
};

window.onWatch = function (event, i) {
  var item = lastItems[i] || {};
  var url = item.watchUrl || "";
  if (!url) { event.preventDefault(); showToast("Link missing"); return false; }
  if (!credential) { event.preventDefault(); showWall("Sign in first"); showToast("Sign in first"); return false; }
  // Fire-and-forget: tell a parent by email, but never block opening the page.
  try {
    fetch("/api/notify", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + credential }, body: JSON.stringify({ title: item.title || "Untitled", url: url, source: item.source || "youtube" }) }).then(function (res) {
      if (res.status === 401) { handleSessionExpired(); return; }
      if (res.ok) { showToast("Sent"); }
      else { showToast("Opened"); }
    }).catch(function () {
      showToast("Opened");
    });
  } catch (e) {
    showToast("Opened");
  }
  return true; // let the link open in a new tab
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function escapeAttr(s) { return escapeHtml(s); }

bootAuth();
</script>
</body>
</html>
